<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Account | The Balm App</title>
    <style>
        :root {
            --balm-primary: #9949f3;
            --balm-primary-light: #c078f8;
            --balm-text: #1f1f29;
            --balm-muted: #6b6b7b;
            --balm-border: #ece7f6;
            --balm-bg: #f5f4f8;
            --balm-danger: #e5484d;
            --balm-danger-bg: #fdeceb;
            --balm-btn: #e5484d;
            --balm-btn-dark: #c93a3f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            font-family:
                -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
                Arial, sans-serif;
            color: var(--balm-text);
            background: var(--balm-bg);
            line-height: 1.55;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(31, 31, 41, 0.08);
            padding: 28px 28px 32px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--balm-border);
        }

        .card-header img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
        }

        .card-header .brand {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--balm-primary) 0%, var(--balm-primary-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--balm-danger-bg);
            color: var(--balm-danger);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            margin: 0 0 8px;
        }

        h1 .highlight {
            background: linear-gradient(90deg, var(--balm-primary) 0%, var(--balm-primary-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--balm-muted);
            margin: 0 0 22px;
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-field label .req {
            color: var(--balm-danger);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .icon-left {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #9a9aa8;
            pointer-events: none;
            display: flex;
        }

        .input-wrap .icon-left svg {
            width: 16px;
            height: 16px;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            font-size: 14px;
            border: 1px solid var(--balm-border);
            border-radius: 10px;
            background: #f8f8fb;
            color: var(--balm-text);
            outline: none;
            transition: border-color 0.15s ease;
        }

        .input-wrap input:focus {
            border-color: var(--balm-primary-light);
            background: #fff;
        }

        .input-wrap .toggle-eye {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: #9a9aa8;
            padding: 6px;
            border-radius: 6px;
        }

        .input-wrap .toggle-eye:hover {
            color: var(--balm-primary);
            background: #f3eefd;
        }

        .input-wrap .toggle-eye svg {
            width: 17px;
            height: 17px;
        }

        .input-wrap .toggle-eye .icon-eye-off {
            display: none;
        }

        .input-wrap .toggle-eye.is-visible .icon-eye {
            display: none;
        }

        .input-wrap .toggle-eye.is-visible .icon-eye-off {
            display: block;
        }

        .confirm-box {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: #f8f7fc;
            border: 1px solid var(--balm-border);
            border-radius: 12px;
            padding: 13px 14px;
            margin: 20px 0 20px;
            font-size: 12.5px;
            color: var(--balm-muted);
        }

        .confirm-box input {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            accent-color: var(--balm-primary);
        }

        .confirm-box strong {
            color: var(--balm-text);
        }

        .delete-btn {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 999px;
            background: var(--balm-btn);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(229, 72, 77, 0.35);
            transition: background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .delete-btn:hover:not(:disabled) {
            background: var(--balm-btn-dark);
        }

        .delete-btn:disabled {
            background: #e9e9ec;
            color: #a3a3ab;
            box-shadow: none;
            cursor: not-allowed;
        }

        .form-message {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.45;
            display: none;
            align-items: flex-start;
            gap: 9px;
        }

        .form-message-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 19px;
            height: 19px;
            margin-top: 1px;
        }

        .form-message-icon svg {
            width: 19px;
            height: 19px;
        }

        .form-message-text {
            font-weight: 500;
        }

        .form-message.success {
            display: flex;
            background: #edfbf3;
            border: 1px solid #b9ecd0;
            color: #176b3c;
        }

        .form-message.error {
            display: flex;
            background: var(--balm-danger-bg);
            border: 1px solid #f7c4c3;
            color: #9a1f23;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--balm-muted);
            margin-top: 20px;
        }

        .footer-note a {
            color: var(--balm-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

                            <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"></path>
                            <path d="m3.5 6.5 8.5 7 8.5-7"></path>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
            </div>

            <div class="form-field">
                <label for="password">Password <span class="req">*</span></label>
                <div class="input-wrap">
                    <span class="icon-left">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4.5" y="10.5" width="15" height="10" rx="2"></rect>
                            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Your account password" autocomplete="current-password" required />
                    <button type="button" class="toggle-eye" id="togglePassword" aria-label="Show password">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path>
                            <path d="M7.4 7.5C4.9 8.9 3 11.5 3 11.5a19.7 19.7 0 0 0 4.1 4.6"></path>
                            <path d="M12 5c7 0 10.5 7 10.5 7a19.6 19.6 0 0 1-4.17 5.17"></path>
                            <path d="M9.9 4.24A9.3 9.3 0 0 1 12 5"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <label class="confirm-box">
                <input type="checkbox" id="confirmCheck" required />
                <span>
                    I understand this will <strong>permanently delete</strong> my
                    Balm account and all associated data, and that it cannot be
                    recovered.
                </span>
            </label>

            <button type="submit" class="delete-btn" id="deleteBtn" disabled>Delete my account</button>

            <div id="formMessage" class="form-message" role="alert">
                <span class="form-message-icon" id="formMessageIcon"></span>
                <span class="form-message-text" id="formMessageText"></span>
            </div>
        </form>

        <p class="footer-note">
            Need help instead? Contact
            <a href="mailto:abalmapp@gmail.com">abalmapp@gmail.com</a>
            or visit
            <a href="https://www.balmzone.com/support" target="_blank" rel="noopener noreferrer">www.balmzone.com/support</a>
        </p>
    </div>

    <script>
        const API_URL = 'https://api.balmzone.com/delete_id';

        const form = document.getElementById('deleteAccountForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmCheck = document.getElementById('confirmCheck');
        const deleteBtn = document.getElementById('deleteBtn');
        const formMessage = document.getElementById('formMessage');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePassword.classList.toggle('is-visible', isHidden);
            togglePassword.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });

        function updateButtonState() {
            const isReady =
                emailInput.value.trim() !== '' &&
                passwordInput.value !== '' &&
                confirmCheck.checked;
            deleteBtn.disabled = !isReady;
        }

        emailInput.addEventListener('input', updateButtonState);
        passwordInput.addEventListener('input', updateButtonState);
        confirmCheck.addEventListener('change', updateButtonState);
        updateButtonState();

        const formMessageIcon = document.getElementById('formMessageIcon');
        const formMessageText = document.getElementById('formMessageText');

        const ICONS = {
            success:
                '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#1fa363"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            error:
                '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#d64545"/><path d="M12 7.5v5.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.2" r="1.1" fill="#fff"/></svg>',
        };

        function showMessage(text, type) {
            formMessageText.textContent = text;
            formMessageIcon.innerHTML = ICONS[type] || '';
            formMessage.className = 'form-message ' + type;
        }

        function clearMessage() {
            formMessageText.textContent = '';
            formMessageIcon.innerHTML = '';
            formMessage.className = 'form-message';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('Please enter both your email and password.', 'error');
                return;
            }

            if (!confirmCheck.checked) {
                showMessage('Please confirm that you understand this action is permanent.', 'error');
                return;
            }

            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (parseErr) {
                    data = null;
                }

                if (response.ok) {
                    showMessage(
                        (data && data.message) ||
                            'Your account deletion request was submitted successfully.',
                        'success',
                    );
                    form.reset();
                } else {
                    showMessage(
                        (data && data.message) ||
                            'We could not delete your account. Please check your email and password and try again.',
                        'error',
                    );
                }
            } catch (err) {
                showMessage(
                    'Something went wrong while submitting your request. Please check your connection and try again.',
                    'error',
                );
            } finally {
                deleteBtn.textContent = 'Delete my account';
                updateButtonState();
            }
        });
    </script>
</body>
</html>
